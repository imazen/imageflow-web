<!-- Header -->
<header id="header"{% if page.layout == 'landing' %} class="alt"{% endif %}>
  <h1><a href="{{ site.baseurl }}/"><img alt="{{ site.title }}" src="{{ site.baseurl }}/images/imageflow-white.svg" /></a></h1>
  <nav id="nav">
    <ul>
      <li class="special">
        <a href="#menu" class="menuToggle"><span>Menu</span></a>
        <div id="menu">
          <ul>
            {% for item in site.nav %}
            <li><a href="{{ site.baseurl }}{{ item.url }}">{{ item.label }}</a></li>
            {% endfor %}
            <li><a href="{{ site.baseurl }}/feed.xml" class="icon fa-feed"> RSS Feed</a></li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
</header>
